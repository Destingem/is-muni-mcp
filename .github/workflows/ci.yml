name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run ruff check src tests mcpb packaging
      - run: uv run ruff format --check src tests mcpb packaging
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv run python mcpb/build.py --out dist/is-muni-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/is-muni-mcp.mcpb

  packaging:
    # Kouřový test PyInstaller buildu (plný matrix až v releasu).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      # Projekt musí být importovatelný, jinak PyInstaller slepí binárku bez něj.
      - run: pip install -e .
      - run: python packaging/build_bin.py --out dist/setup
      - run: dist/setup/is-muni-mcp --version
      - run: >-
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize",
          "params":{"protocolVersion":"2024-11-05","capabilities":{},
          "clientInfo":{"name":"t","version":"0"}}}'
          | ISMU_COOKIE="dummy; dummy2" dist/setup/is-muni-mcp | grep -q '"result"'

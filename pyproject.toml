[project]
name = "is-muni-mcp"
version = "1.0.0"
description = "Read-only MCP server pro studenty MU: propojení AI agentů s IS MUNI (kalendář, výuka, pošta, notifikace, poznámkové bloky, studijní materiály)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Destingem", email = "80842481+Destingem@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "is-muni", "masaryk-university", "student"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Czech",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "icalendar>=6.0.0",
  "recurring-ical-events>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Destingem/is-muni-mcp"
Documentation = "https://github.com/Destingem/is-muni-mcp#readme"
Repository = "https://github.com/Destingem/is-muni-mcp"
Issues = "https://github.com/Destingem/is-muni-mcp/issues"
Changelog = "https://github.com/Destingem/is-muni-mcp/blob/main/CHANGELOG.md"

[project.scripts]
is-muni-mcp = "is_muni_mcp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/is_muni_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
